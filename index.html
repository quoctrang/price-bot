<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So Sánh Giá Bán Lẻ Siêu Thị & Shopee</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-center text-emerald-600 mb-6">So Sánh Giá Bán Lẻ Siêu Thị & Shopee</h1>
        
        <!-- Ô tìm kiếm sản phẩm -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Gõ tên sản phẩm (ví dụ: Aquafina, Redbull, Hảo Hảo...)..." 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Khu vực hiển thị danh sách sản phẩm so sánh giá -->
        <div id="productList" class="space-y-6">
            <p class="text-center text-gray-500">Đang tải dữ liệu sản phẩm...</p>
        </div>
    </div>

    <script>
        // ==========================================
        // CẤU HÌNH KẾT NỐI SUPABASE CỦA BẠN
        // ==========================================
        const SUPABASE_URL = 'https://nizpwabxzslsscbewtro.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJl5-your-key-here...'; // Thay key thật của bạn vào đây

        async function fetchProducts() {
            try {
                const response = await fetch(`${SUPABASE_URL}/rest/v1/products?select=*`, {
                    headers: {
                        "apikey": SUPABASE_KEY,
                        "Authorization": `Bearer ${SUPABASE_KEY}`
                    }
                });
                const data = await response.json();
                window.allProductsData = data; 
                displayProducts(data, document.getElementById('searchInput').value);
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
                document.getElementById('productList').innerHTML = `<p class="text-center text-red-500">Không thể tải dữ liệu sản phẩm từ Supabase.</p>`;
            }
        }

        function displayProducts(products, filter = "") {
            const container = document.getElementById('productList');
            container.innerHTML = '';

            if (!products || products.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500">Chưa có sản phẩm nào trong cơ sở dữ liệu.</p>`;
                return;
            }

            // Lọc theo từ khóa tìm kiếm
            const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500">Không tìm thấy sản phẩm phù hợp với từ khóa.</p>`;
                return;
            }

            // Gom nhóm chính xác dựa vào tên sản phẩm (name) để gom mọi cửa hàng vào chung 1 thẻ
            const groupedMap = {};
            filtered.forEach(p => {
                const groupKey = p.name.trim(); // Gom theo đúng tên sản phẩm

                if (!groupedMap[groupKey]) {
                    groupedMap[groupKey] = {
                        name: p.name,
                        image_url: p.image_url || 'https://via.placeholder.com/150',
                        items: []
                    };
                }
                
                // Tránh thêm trùng cùng một cửa hàng vào một thẻ
                if (!groupedMap[groupKey].items.some(i => i.store === p.store)) {
                    groupedMap[groupKey].items.push(p);
                }
            });

            // Hiển thị ra giao diện
            Object.values(groupedMap).forEach(group => {
                // Sắp xếp giá từ thấp đến cao (Cửa hàng rẻ nhất tự động lên đầu)
                group.items.sort((a, b) => a.price - b.price);

                let itemsHtml = '';
                group.items.forEach((item, index) => {
                    const isCheapest = index === 0; // Phần tử đầu tiên là rẻ nhất
                    const priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price);
                    
                    itemsHtml += `
                        <div class="flex justify-between items-center p-2.5 rounded-lg ${isCheapest ? 'bg-amber-50 border border-amber-200 shadow-sm' : 'bg-white border border-gray-100'}">
                            <span class="font-medium text-gray-700 flex items-center gap-2 text-sm">
                                <span>${isCheapest ? '⭐' : '•'}</span>
                                ${item.store} 
                                ${isCheapest ? '<span class="text-xs bg-amber-500 text-white px-2 py-0.5 rounded-full font-semibold">Rẻ nhất</span>' : ''}
                            </span>
                            <span class="font-bold text-sm ${isCheapest ? 'text-amber-700 text-base' : 'text-gray-800'}">${priceFormatted}</span>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex gap-4 items-start">
                        <img src="${group.image_url}" alt="${group.name}" class="w-20 h-20 object-cover rounded-lg border border-gray-100 bg-gray-50 flex-shrink-0" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="flex-1 min-w-0">
                            <h2 class="font-bold text-gray-800 text-sm md:text-base mb-2">${group.name}</h2>
                            <div class="space-y-1.5">
                                ${itemsHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Lắng nghe sự kiện tìm kiếm trực tiếp
        document.getElementById('searchInput').addEventListener('input', (e) => {
            if (window.allProductsData) {
                displayProducts(window.allProductsData, e.target.value);
            }
        });

        // Tải dữ liệu lần đầu
        fetchProducts();
    </script>
</body>
</html>
