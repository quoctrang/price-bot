<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>So Sánh Giá Siêu Thị & Cửa Hàng Tiện Lợi</title>
    <!-- Sử dụng Tailwind CSS cho giao diện đẹp, hiện đại -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-gray-50 min-h-screen py-8 px-4">
    <div class="max-w-2xl mx-auto">
        <h1 class="text-2xl font-bold text-center text-emerald-600 mb-6">So Sánh Giá Siêu Thị & Cửa Hàng Tiện Lợi</h1>
        
        <!-- Ô tìm kiếm sản phẩm -->
        <div class="mb-6">
            <input type="text" id="searchInput" placeholder="Gõ tên sản phẩm cần tìm..." 
                class="w-full px-4 py-3 border border-gray-300 rounded-lg shadow-sm focus:outline-none focus:ring-2 focus:ring-emerald-500">
        </div>

        <!-- Khu vực hiển thị danh sách sản phẩm so sánh giá -->
        <div id="productList" class="space-y-6">
            <p class="text-center text-gray-500">Đang tải dữ liệu sản phẩm...</p>
        </div>
    </div>

    <script>
        // Cấu hình kết nối Supabase của bạn
        const SUPABASE_URL = 'https://nizpwabxszlsscbewtro.supabase.co';
        const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im5penB3YWJ4c3psc3NjYmV3dHJvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk1MzMzODYsImV4cCI6MjEwNTEwOTM4Nn0.Ej7cw2jGIg7-PHg_FRHmP63zgEX0P7BO5DaJVNjrC8Y'; // Dùng key hiện tại của bạn
        
        // Khởi tạo Supabase client (hoặc dùng fetch trực tiếp từ REST API nếu file thuần)
        const supabaseUrl = SUPABASE_URL;
        const supabaseKey = SUPABASE_KEY;

        // Hàm chuẩn hóa tên sản phẩm thông minh để gom nhóm các tên gần giống nhau
        function normalizeProductName(name) {
            if (!name) return "";
            return name.toLowerCase()
                .normalize("NFD").replace(/[\u0300-\u036f]/g, "") // Bỏ dấu tiếng Việt
                .replace(/thung|loc|hop|goi|chai|lon/g, "") // Bỏ các đơn vị quy cách hay lệch nhau
                .replace(/[^a-z0-9]/g, "") // Chỉ giữ lại chữ và số để so sánh cốt lõi
                .trim();
        }

        async function fetchProducts() {
            try {
                const response = await fetch(`${supabaseUrl}/rest/v1/products?select=*`, {
                    headers: {
                        "apikey": supabaseKey,
                        "Authorization": `Bearer ${supabaseKey}`
                    }
                });
                const data = await response.json();
                displayProducts(data);
            } catch (error) {
                console.error("Lỗi tải dữ liệu:", error);
                document.getElementById('productList').innerHTML = `<p class="text-center text-red-500">Không thể tải dữ liệu sản phẩm.</p>`;
            }
        }

        function displayProducts(products, filter = "") {
            const container = document.getElementById('productList');
            container.innerHTML = '';

            if (!products || products.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500">Chưa có sản phẩm nào.</p>`;
                return;
            }

            // Lọc theo từ khóa tìm kiếm
            const filtered = products.filter(p => p.name.toLowerCase().includes(filter.toLowerCase()));

            if (filtered.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500">Không tìm thấy sản phẩm phù hợp.</p>`;
                return;
            }

            // Thuật toán gom nhóm thông minh dựa trên tên đã chuẩn hóa
            const groupedMap = {};
            filtered.forEach(p => {
                // Tìm xem đã có nhóm nào có tên gần giống chưa
                const keyNorm = normalizeProductName(p.name);
                
                // Tìm kiếm xem có cụm nào tương đồng cao không để gom chung
                let foundKey = Object.keys(groupedMap).find(k => {
                    // Nếu chuỗi chuẩn hóa chứa nhau hoặc trùng khớp cao
                    return k.includes(keyNorm) || keyNorm.includes(k) || (k.substring(0, 6) === keyNorm.substring(0, 6));
                });

                if (!foundKey) {
                    foundKey = p.name; // Lấy tên sản phẩm làm gốc nếu tạo nhóm mới
                    groupedMap[foundKey] = {
                        name: p.name,
                        image_url: p.image_url || 'https://via.placeholder.com/150',
                        items: []
                    };
                }
                
                // Tránh thêm trùng cửa hàng trong cùng một nhóm
                groupedMap[foundKey].items.push(p);
            });

            // Hiển thị ra giao diện
            Object.values(groupedMap).forEach(group => {
                // Sắp xếp các mức giá từ thấp đến cao trong cùng nhóm
                group.items.sort((a, b) => a.price - b.price);
                const cheapestPrice = group.items[0].price;

                let itemsHtml = '';
                group.items.forEach((item, index) => {
                    const isCheapest = index === 0;
                    const priceFormatted = new Intl.NumberFormat('vi-VN', { style: 'currency', currency: 'VND' }).format(item.price);
                    
                    itemsHtml += `
                        <div class="flex justify-between items-center p-3 rounded-lg ${isCheapest ? 'bg-emerald-50 border border-emerald-200' : 'bg-white border border-gray-100'}">
                            <span class="font-medium text-gray-700 flex items-center gap-2">
                                ${item.store} 
                                ${isCheapest ? '<span class="text-xs bg-emerald-600 text-white px-2 py-0.5 rounded-full">Rẻ nhất</span>' : ''}
                            </span>
                            <span class="font-bold ${isCheapest ? 'text-emerald-700 text-lg' : 'text-gray-800'}">${priceFormatted}</span>
                        </div>
                    `;
                });

                const cardHtml = `
                    <div class="bg-white border border-gray-200 rounded-xl p-4 shadow-sm flex gap-4 items-start">
                        <img src="${group.image_url}" alt="${group.name}" class="w-24 h-24 object-cover rounded-lg border border-gray-100 bg-gray-50" onerror="this.src='https://via.placeholder.com/150'">
                        <div class="flex-1">
                            <h2 class="font-bold text-gray-800 text-base mb-3">${group.name}</h2>
                            <div class="space-y-2">
                                ${itemsHtml}
                            </div>
                        </div>
                    </div>
                `;
                container.innerHTML += cardHtml;
            });
        }

        // Lắng nghe sự kiện gõ tìm kiếm
        document.getElementById('searchInput').addEventListener('input', (e) => {
            // Gọi lại hàm lấy dữ liệu hoặc lọc từ biến cục bộ
            fetchProducts(); 
        });

        // Chạy lần đầu khi mở trang
        fetchProducts();
    </script>
</body>
</html>
